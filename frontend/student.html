<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>העוזר החכם של המכללה - צ'אט סטודנטים</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Heebo', sans-serif; }

    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      animation: blink 0.8s infinite;
      color: #4f46e5;
      margin-right: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-in { animation: fadeSlideUp 0.25s ease-out; }

    @keyframes screenIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .screen-in { animation: screenIn 0.3s ease-out; }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 37%, #e2e8f0 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    .drawer-overlay { transition: opacity 0.25s ease; }
    .drawer-panel { transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1); }

    .btn-press:active { transform: scale(0.97); }

    #appRoot::-webkit-scrollbar, .scroll-area::-webkit-scrollbar { width: 6px; }
    #appRoot::-webkit-scrollbar-thumb, .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }

    .tab-pill { transition: all 0.2s ease; }

    .spinner {
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      width: 16px; height: 16px;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    .spinner-dark {
      border: 2.5px solid #e2e8f0;
      border-top-color: #4f46e5;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ===== מובייל: מסך מלא קבוע, רק שורת ההקלדה עולה עם המקלדת ===== */
    html, body { overscroll-behavior: none; overflow-x: hidden; width: 100%; }
    /* iOS Safari מזהה שדה עם גופן קטן מ-16px ומבצע זום אוטומטי בלחיצה - חוסמים זאת לגמרי.
       !important כי Tailwind (הטעון דרך ה-CDN script) יכול להזריק את ה-text-sm שלו אחרי הבלוק הזה ב-DOM. */
    input, textarea, select { font-size: 16px !important; }
    @media (max-width: 639px) {
      html, body { height: 100%; overflow: hidden; }
      body { display: block !important; min-height: 0 !important; padding: 0 !important; }
      #appRoot {
        position: fixed; top: 0; left: 0;
        width: 100%; max-width: none;
        height: var(--app-h, 100dvh);
        border-radius: 0; border: 0; box-shadow: none;
        padding-top: env(safe-area-inset-top);
        background: linear-gradient(to bottom, #4f46e5 env(safe-area-inset-top), #fff env(safe-area-inset-top));
      }
      #chatScreen form { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

  <!-- קונטיינר דמוי אפליקציית מובייל (PWA) -->
  <div id="appRoot" class="relative w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-x-hidden overflow-hidden flex flex-col h-[92dvh] border border-slate-200">

    <!-- ===================== מסך טעינה ראשוני ===================== -->
    <div id="initLoader" class="absolute inset-0 z-50 bg-white flex flex-col items-center justify-center gap-3">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-l from-indigo-600 to-blue-600 flex items-center justify-center text-2xl shadow-lg">🎓</div>
      <div class="spinner spinner-dark w-6 h-6"></div>
    </div>

    <!-- ===================== מסך התחברות / הרשמה ===================== -->
    <div id="authScreen" class="hidden absolute inset-0 z-40 bg-white flex flex-col overflow-y-auto scroll-area">
      <div class="flex-1 flex flex-col justify-center px-7 py-10 screen-in">
        <div class="flex flex-col items-center mb-7">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-l from-indigo-600 to-blue-600 flex items-center justify-center text-3xl shadow-lg mb-3">🎓</div>
          <h1 class="font-extrabold text-xl text-slate-800">העוזר החכם של המכללה</h1>
          <p class="text-xs text-slate-500 mt-1">מענה מיידי מבוסס נהלי המכללה הרשמיים</p>
        </div>

        <!-- הודעת שגיאה -->
        <div id="authError" class="hidden mb-4 text-sm bg-rose-50 border border-rose-200 text-rose-700 rounded-xl px-3.5 py-2.5"></div>

        <!-- כניסת בדיקה זמנית: סיסמה אחידה בלבד, בלי שם משתמש.
             הכניסה "האמיתית" תגיע בעתיד מה-ID+טוקן של אפליקציית Moodle המארחת (ראו את פאנל הבדיקה למטה). -->
        <form id="testLoginForm" onsubmit="handleTestLogin(event)" class="flex flex-col gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1.5">סיסמת בדיקה</label>
            <input id="testPasswordInput" type="password" inputmode="numeric" autocomplete="off" placeholder="1234"
              class="w-full bg-slate-50 focus:bg-white border border-slate-300 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-sm outline-none transition" />
          </div>
          <button id="testLoginSubmitBtn" type="submit" class="btn-press mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-2">
            <span id="testLoginSubmitText">כניסה לבדיקה</span>
          </button>
        </form>
        <p class="text-[11px] text-slate-400 text-center mt-3">
          זו כניסת בדיקה זמנית בלבד (סיסמה אחידה, בלי חשבון אישי) - הכניסה האמיתית תגיע מאפליקציית המכללה הראשית (Moodle).
        </p>

        <button type="button" onclick="toggleMoodlePanel()" class="text-[11px] text-indigo-500 hover:text-indigo-700 underline text-center mt-5">
          🔗 בדיקת חיבור Moodle (למפתחים בלבד)
        </button>

        <div id="moodlePanel" class="hidden mt-3 border-t border-slate-200 pt-4">
          <label class="block text-xs font-medium text-slate-600 mb-1.5">טוקן Moodle לבדיקה</label>
          <textarea id="moodleTokenInput" rows="2" placeholder="הדביקו כאן טוקן Moodle אמיתי שהתקבל מהאפליקציה המארחת"
            class="w-full bg-slate-50 focus:bg-white border border-slate-300 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-sm outline-none transition"></textarea>
          <button id="moodleConnectBtn" onclick="connectMoodle()" class="btn-press mt-2 w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
            <span id="moodleConnectText">חבר עם טוקן Moodle</span>
          </button>
          <div id="moodleResult" class="mt-3 text-xs"></div>
        </div>
      </div>
    </div>

    <!-- ===================== מודל: מה שמור עלי ב-DB (שקיפות, לבדיקות) ===================== -->
    <div id="myDataOverlay" class="hidden absolute inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onclick="if (event.target === this) closeMyDataPanel()">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm max-h-[80%] flex flex-col overflow-hidden">
        <div class="bg-gradient-to-l from-indigo-600 to-blue-600 text-white p-4 flex items-center justify-between shrink-0">
          <h3 class="font-bold text-sm">🔍 מה שמור עלי ב-DB</h3>
          <button onclick="closeMyDataPanel()" class="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25 flex items-center justify-center transition">✕</button>
        </div>
        <div id="myDataBody" class="flex-1 overflow-y-auto p-4 text-xs text-slate-700 space-y-1.5">טוען...</div>
        <div class="p-3 border-t border-slate-200 shrink-0">
          <button onclick="loadMyData()" class="btn-press w-full text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 py-2 rounded-lg transition">🔄 רענן</button>
        </div>
      </div>
    </div>

    <!-- ===================== מסך הצ'אט ===================== -->
    <div id="chatScreen" class="hidden flex-1 min-h-0 flex flex-col screen-in">

      <!-- Header -->
      <div class="bg-gradient-to-l from-indigo-600 to-blue-600 text-white p-4 shadow-md shrink-0">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <button onclick="openDrawer()" class="btn-press w-9 h-9 rounded-xl bg-white/15 hover:bg-white/25 flex items-center justify-center transition" aria-label="שיחות">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>
            <div class="w-10 h-10 rounded-2xl bg-white/20 flex items-center justify-center text-xl shadow-inner shrink-0">
              🎓
            </div>
            <div>
              <h1 class="font-bold text-base leading-tight">העוזר החכם של המכללה</h1>
              <p class="text-[11px] text-indigo-100">שאלות ללא הגבלה</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="openMyDataPanel()" class="text-[11px] bg-white/20 hover:bg-white/30 px-2 py-1.5 rounded-lg transition" title="מה שמור עלי ב-DB (לבדיקות)">🔍</button>
            <button onclick="handleLogout()" class="text-[11px] bg-white/20 hover:bg-white/30 px-2 py-1.5 rounded-lg transition">יציאה</button>
          </div>
        </div>
        <div class="bg-black/20 rounded-xl px-3 py-2 backdrop-blur-sm flex items-center justify-between">
          <div class="flex items-center gap-1.5 text-xs min-w-0">
            <span class="shrink-0">💬</span>
            <span id="activeConvTitle" class="font-bold truncate">שיחה חדשה</span>
          </div>
          <button onclick="startNewConversation()" class="btn-press shrink-0 text-xs bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-lg transition font-bold">
            + שיחה חדשה
          </button>
        </div>
      </div>

      <!-- התראת מערכת (שגיאות תקשורת וכד') -->
      <div id="systemNotice" class="hidden px-4 pt-3"></div>

      <!-- אזור הודעות הצ'אט -->
      <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50 scroll-area"></div>

      <!-- שורת הקלדה -->
      <form onsubmit="sendMessage(event)" class="p-3 bg-white border-t border-slate-200 flex items-center gap-2 shrink-0">
        <input
          id="questionInput"
          type="text"
          placeholder="הקלד שאלה על נהלי המכללה..."
          class="flex-1 bg-slate-100 focus:bg-white border border-slate-300 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-sm outline-none transition"
          autocomplete="off"
        />
        <button
          id="sendBtn"
          type="submit"
          class="btn-press bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition shadow-sm shrink-0"
        >
          שלח
        </button>
      </form>
    </div>

    <!-- ===================== מגש שיחות (Drawer) ===================== -->
    <div id="drawerOverlay" class="drawer-overlay hidden absolute inset-0 z-30 bg-black/40 opacity-0" onclick="closeDrawer()"></div>
    <div id="drawerPanel" class="drawer-panel absolute inset-y-0 right-0 z-30 w-[82%] max-w-[320px] bg-white shadow-2xl translate-x-full flex flex-col">
      <div class="bg-gradient-to-l from-indigo-600 to-blue-600 text-white p-4 flex items-center justify-between shrink-0">
        <h2 class="font-bold text-sm">השיחות שלי</h2>
        <button onclick="closeDrawer()" class="w-8 h-8 rounded-lg bg-white/15 hover:bg-white/25 flex items-center justify-center transition">✕</button>
      </div>
      <div class="p-3 shrink-0">
        <button onclick="startNewConversation()" class="btn-press w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold text-sm py-2.5 rounded-xl transition">
          + שיחה חדשה
        </button>
      </div>
      <div id="conversationsList" class="flex-1 overflow-y-auto scroll-area px-3 pb-3 space-y-1.5"></div>
    </div>

  </div>

  <script>
    const API_BASE = window.location.origin;

    function safeStorageGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }
    function safeStorageSet(key, value) {
      try { localStorage.setItem(key, value); } catch { /* storage unavailable (private mode, etc.) */ }
    }
    function safeStorageRemove(key) {
      try { localStorage.removeItem(key); } catch { /* ignore */ }
    }

    let TOKEN = safeStorageGet('token') || null;
    let USER_ID = safeStorageGet('user_id') || null;
    // טוקן Moodle חי רק בדפדפן של הסטודנט - לעולם לא נשמר אצלנו ב-DB או בזיכרון השרת בין בקשות.
    // מצורף מחדש מכאן בכל קריאת צ'אט שבה יש חיבור פעיל, כדי לאפשר ל-AI לשלוף מידע אישי אמיתי.
    let MOODLE_TOKEN = safeStorageGet('moodle_token') || null;
    let MOODLE_USER_ID = safeStorageGet('moodle_user_id') || null;
    let currentConversationId = null;
    let conversationsCache = [];
    let isSending = false;

    // ---------- DOM refs ----------
    const initLoader = document.getElementById('initLoader');
    const authScreen = document.getElementById('authScreen');
    const chatScreen = document.getElementById('chatScreen');
    const chatMessages = document.getElementById('chatMessages');
    const systemNotice = document.getElementById('systemNotice');

    // ---------- Helpers ----------
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    async function apiFetch(path, options = {}) {
      const headers = Object.assign({}, options.headers || {});
      if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
      try {
        const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
        return { res, networkError: false };
      } catch (err) {
        return { res: null, networkError: true, error: err };
      }
    }

    async function safeJson(res) {
      try { return await res.json(); } catch { return {}; }
    }

    function showSystemNotice(text, tone = 'warn') {
      const toneClasses = tone === 'warn'
        ? 'bg-amber-50 border-amber-200 text-amber-700'
        : 'bg-rose-50 border-rose-200 text-rose-700';
      systemNotice.innerHTML = `<div class="text-xs border rounded-xl px-3 py-2 mb-1 ${toneClasses}">${escapeHtml(text)}</div>`;
      systemNotice.classList.remove('hidden');
    }

    function clearSystemNotice() {
      systemNotice.classList.add('hidden');
      systemNotice.innerHTML = '';
    }

    // ---------- Auth screen ----------
    function showAuthError(text) {
      const el = document.getElementById('authError');
      el.textContent = text;
      el.classList.remove('hidden');
    }

    function clearAuthError() {
      const el = document.getElementById('authError');
      el.classList.add('hidden');
      el.textContent = '';
    }

    async function handleTestLogin(e) {
      e.preventDefault();
      clearAuthError();
      const password = document.getElementById('testPasswordInput').value;
      if (!password) { showAuthError('נא להזין סיסמת בדיקה'); return; }

      const btn = document.getElementById('testLoginSubmitBtn');
      const text = document.getElementById('testLoginSubmitText');
      btn.disabled = true;
      text.innerHTML = `<span class="spinner"></span>`;

      const { res, networkError } = await apiFetch('/api/test-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });

      btn.disabled = false;
      text.textContent = 'כניסה לבדיקה';

      if (networkError) {
        showAuthError('⚠️ לא ניתן להתחבר לשרת כרגע. בדקו את החיבור ונסו שוב.');
        return;
      }
      const data = await safeJson(res);
      if (!res.ok) {
        showAuthError(data.detail || 'סיסמת בדיקה שגויה.');
        return;
      }
      if (!data.token) {
        showAuthError('התקבלה תשובה לא תקינה מהשרת. נסו שוב.');
        return;
      }
      TOKEN = data.token;
      USER_ID = data.user_id || null;
      safeStorageSet('token', TOKEN);
      if (USER_ID !== null) safeStorageSet('user_id', USER_ID);
      await enterApp();
    }

    // ---------- בדיקת חיבור Moodle (תשתית ראשונית, למפתחים) ----------
    function toggleMoodlePanel() {
      document.getElementById('moodlePanel').classList.toggle('hidden');
    }

    async function connectMoodle() {
      const token = document.getElementById('moodleTokenInput').value.trim();
      const resultEl = document.getElementById('moodleResult');
      const btn = document.getElementById('moodleConnectBtn');
      const text = document.getElementById('moodleConnectText');
      if (!token) {
        resultEl.innerHTML = '<div class="text-rose-600">נא להדביק טוקן Moodle</div>';
        return;
      }
      btn.disabled = true;
      text.innerHTML = '<span class="spinner"></span>';
      resultEl.innerHTML = '';

      const { res, networkError } = await apiFetch('/api/moodle/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });
      btn.disabled = false;
      text.textContent = 'חבר עם טוקן Moodle';

      if (networkError) {
        resultEl.innerHTML = '<div class="text-rose-600">⚠️ לא ניתן להתחבר לשרת כרגע.</div>';
        return;
      }
      const data = await safeJson(res);
      if (!res.ok) {
        resultEl.innerHTML = `<div class="text-rose-600">⛔ ${escapeHtml(data.detail || 'שגיאה בחיבור ל-Moodle')}</div>`;
        return;
      }

      TOKEN = data.token;
      USER_ID = data.user_id || null;
      safeStorageSet('token', TOKEN);
      if (USER_ID !== null) safeStorageSet('user_id', USER_ID);

      const m = data.moodle || {};
      // שומרים את הטוקן הגולמי שהודבק (לא מפוענחים כאן בצד הלקוח - השרת כבר יודע לפענח
      // moodlemobile://token=... בכל קריאה, ב-/api/moodle/connect וגם בכל הודעת צ'אט).
      // זה חי רק בדפדפן הזה - אף פעם לא נשמר ב-DB שלנו.
      MOODLE_TOKEN = token;
      MOODLE_USER_ID = m.userid != null ? String(m.userid) : null;
      safeStorageSet('moodle_token', MOODLE_TOKEN);
      if (MOODLE_USER_ID !== null) safeStorageSet('moodle_user_id', MOODLE_USER_ID);

      const fnList = Array.isArray(m.available_functions) ? m.available_functions : null;
      const relevantNames = ['assign', 'grade', 'calendar', 'enrol_get_users_courses', 'course_get_contents'];
      const fnBlock = fnList
        ? `<div class="mt-2 pt-2 border-t border-emerald-200">
             <div class="font-bold mb-1">🔍 פונקציות webservice שהטוקן הזה מורשה לקרוא (${fnList.length} סה"כ):</div>
             <div class="max-h-32 overflow-y-auto text-[11px] font-mono bg-white/60 rounded-lg p-2">
               ${fnList.map(n => {
                 const relevant = relevantNames.some(r => n.includes(r));
                 return `<div class="${relevant ? 'font-bold text-emerald-900' : 'text-emerald-700'}">${escapeHtml(n)}</div>`;
               }).join('')}
             </div>
             <div class="text-[11px] text-emerald-700 mt-1">המודגשות למעלה הן אלה שרלוונטיות לקורסים/ציונים/מטלות/יומן - השוו לשמות שכתובים כרגע ב-rag_engine.py.</div>
           </div>`
        : `<div class="mt-2 pt-2 border-t border-emerald-200 text-[11px] text-amber-700">⚠️ Moodle לא החזיר רשימת פונקציות זמינות (ייתכן שזה מושבת אצל המוסד) - אי אפשר לדעת מכאן בוודאות אילו שמות פונקציה פעילים.</div>`;

      resultEl.innerHTML = `
        <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-3 space-y-1">
          <div class="font-bold">✅ הטוקן תקף - מחובר כ: ${escapeHtml(m.fullname || m.username || '')}</div>
          <div>Moodle userid: <b>${escapeHtml(m.userid ?? '—')}</b> · Moodle username: <b>${escapeHtml(m.username ?? '—')}</b></div>
          <div>ה-ID שהוקצה לו אצלנו (app_users.id): <b class="break-all">${escapeHtml(data.user_id)}</b></div>
          ${fnBlock}
        </div>
        <button onclick="enterApp()" class="btn-press w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">המשך לצ'אט ←</button>
      `;
    }

    // ---------- פאנל שקיפות: מה שמור עלי ב-DB כרגע (לבדיקות) ----------
    function closeMyDataPanel() {
      document.getElementById('myDataOverlay').classList.add('hidden');
    }

    function openMyDataPanel() {
      document.getElementById('myDataOverlay').classList.remove('hidden');
      loadMyData();
    }

    async function loadMyData() {
      const body = document.getElementById('myDataBody');
      body.textContent = 'טוען...';
      const { res, networkError } = await apiFetch('/api/me');
      if (networkError) { body.innerHTML = '<div class="text-rose-600">⚠️ שגיאת תקשורת</div>'; return; }
      const data = await safeJson(res);
      if (!res.ok) { body.innerHTML = `<div class="text-rose-600">⛔ ${escapeHtml(data.detail || 'שגיאה')}</div>`; return; }

      const created = data.created_at ? new Date(data.created_at).toLocaleString('he-IL') : '—';
      const last = data.last_message_at ? new Date(data.last_message_at).toLocaleString('he-IL') : '—';
      body.innerHTML = `
        <div class="flex justify-between"><span class="text-slate-500">שם משתמש</span><span class="font-bold">${escapeHtml(data.username)}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">app_users.id</span><span class="font-bold break-all">${escapeHtml(data.id)}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">נוצר בתאריך</span><span class="font-bold">${created}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">מספר שיחות</span><span class="font-bold">${data.conversation_count ?? 0}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">מספר הודעות</span><span class="font-bold">${data.message_count ?? 0}</span></div>
        <div class="flex justify-between"><span class="text-slate-500">הודעה אחרונה</span><span class="font-bold">${last}</span></div>
        <div class="text-[10px] text-slate-400 pt-2 border-t border-slate-100 mt-2">זה בדיוק מה ששמור עלינו ב-DB כרגע - שום דבר מעבר לזה (לא טוקן Moodle, לא ציונים/קורסים).</div>
      `;
    }

    function handleLogout() {
      safeStorageRemove('token');
      safeStorageRemove('user_id');
      safeStorageRemove('moodle_token');
      safeStorageRemove('moodle_user_id');
      TOKEN = null;
      USER_ID = null;
      MOODLE_TOKEN = null;
      MOODLE_USER_ID = null;
      currentConversationId = null;
      conversationsCache = [];
      chatMessages.innerHTML = '';
      clearSystemNotice();
      chatScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
      document.getElementById('testPasswordInput').value = '';
    }

    // ---------- App entry ----------
    async function enterApp() {
      authScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      clearSystemNotice();
      await initConversations();
      subscribeToPushNotifications();
    }

    // ---------- Drawer ----------
    function openDrawer() {
      document.getElementById('drawerOverlay').classList.remove('hidden');
      requestAnimationFrame(() => {
        document.getElementById('drawerOverlay').classList.remove('opacity-0');
        document.getElementById('drawerPanel').classList.remove('translate-x-full');
      });
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.add('opacity-0');
      document.getElementById('drawerPanel').classList.add('translate-x-full');
      setTimeout(() => document.getElementById('drawerOverlay').classList.add('hidden'), 250);
    }

    function formatDate(iso) {
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', year: '2-digit' }) +
          ' · ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
      } catch { return ''; }
    }

    function renderConversationsList() {
      const list = document.getElementById('conversationsList');
      if (!conversationsCache.length) {
        list.innerHTML = `<div class="text-center text-xs text-slate-400 py-8">עדיין אין שיחות.<br>התחילו שיחה חדשה כדי לשאול שאלה 💬</div>`;
        return;
      }
      list.innerHTML = conversationsCache.map(c => {
        const active = c.id === currentConversationId;
        return `
          <button onclick="openConversation('${c.id}')" class="btn-press w-full text-right p-3 rounded-xl border transition ${active ? 'bg-indigo-50 border-indigo-300' : 'bg-white border-slate-200 hover:bg-slate-50'}">
            <div class="flex items-center justify-between gap-2">
              <span class="font-semibold text-sm truncate ${active ? 'text-indigo-700' : 'text-slate-800'}">${escapeHtml(c.title || 'שיחה')}</span>
              ${active ? '<span class="text-[10px] bg-indigo-600 text-white px-1.5 py-0.5 rounded-full shrink-0">פעיל</span>' : ''}
            </div>
            <div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(formatDate(c.created_at))}</div>
          </button>
        `;
      }).join('');
    }

    function updateConversationIndicator() {
      const conv = conversationsCache.find(c => c.id === currentConversationId);
      document.getElementById('activeConvTitle').textContent = conv ? (conv.title || 'שיחה חדשה') : 'שיחה חדשה';
    }

    async function initConversations() {
      renderWelcomeLoading();
      const { res, networkError } = await apiFetch('/api/conversations');

      if (networkError || !res.ok) {
        conversationsCache = [];
        renderConversationsList();
        if (networkError) showSystemNotice('⚠️ לא ניתן להתחבר לשרת כרגע. ניתן לנסות לשלוח הודעה כשהחיבור יתחדש.', 'error');
        showWelcomeMessage();
        return;
      }

      const data = await safeJson(res);
      conversationsCache = Array.isArray(data.conversations) ? data.conversations : [];
      renderConversationsList();

      if (conversationsCache.length > 0) {
        await openConversation(conversationsCache[0].id);
      } else {
        currentConversationId = null;
        updateConversationIndicator();
        showWelcomeMessage();
      }
    }

    async function openConversation(id) {
      currentConversationId = id;
      closeDrawer();
      updateConversationIndicator();
      renderConversationsList();
      renderWelcomeLoading();

      const { res, networkError } = await apiFetch(`/api/conversations/${id}/messages`);
      if (networkError || !res.ok) {
        clearChatMessages();
        showChatError('⚠️ לא ניתן לטעון את היסטוריית השיחה כרגע.');
        return;
      }
      const data = await safeJson(res);
      const messages = Array.isArray(data.messages) ? data.messages : [];
      clearChatMessages();
      if (messages.length === 0) {
        showWelcomeMessage();
        return;
      }
      messages.forEach(m => {
        if (m.role === 'user') appendUserBubble(m.content);
        else appendStaticBotBubble(m.content);
      });
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function createConversation() {
      const { res, networkError } = await apiFetch('/api/conversations', { method: 'POST' });
      if (networkError || !res.ok) return false;
      const data = await safeJson(res);
      if (!data.id) return false;
      currentConversationId = data.id;
      conversationsCache.unshift({ id: currentConversationId, title: data.title || 'שיחה חדשה', created_at: data.created_at || new Date().toISOString() });
      renderConversationsList();
      updateConversationIndicator();
      return true;
    }

    async function startNewConversation() {
      closeDrawer();
      clearSystemNotice();
      renderWelcomeLoading();
      const ok = await createConversation();
      if (!ok) {
        clearChatMessages();
        showChatError('⚠️ לא ניתן ליצור שיחה חדשה כרגע. נסו שוב בעוד רגע.');
        return;
      }
      showWelcomeMessage();
    }

    function clearChatMessages() {
      chatMessages.innerHTML = '';
    }

    function renderWelcomeLoading() {
      chatMessages.innerHTML = `<div class="skeleton h-20 rounded-2xl"></div><div class="skeleton h-14 w-2/3 rounded-2xl mr-auto"></div>`;
    }

    function showWelcomeMessage() {
      clearChatMessages();
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2.5 msg-in';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold shrink-0">🤖</div>
        <div class="bg-white border border-slate-200 rounded-2xl rounded-tr-none p-3.5 text-sm text-slate-800 shadow-sm max-w-[85%]">
          שלום! 👋 אני העוזר החכם של המכללה.
          <br><br>
          אפשר לשאול אותי שאלות כמו:
          <div class="mt-2 flex flex-wrap gap-1.5">
            <button onclick="askQuick('למי פונים כשיש בעיה בשכר לימוד?')" class="btn-press text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2.5 py-1.5 rounded-lg border border-indigo-200 transition text-right">
              💳 למי פונים בנושא שכר לימוד?
            </button>
            <button onclick="askQuick('הייתי במילואים והפסדתי מבחן, מה עושים?')" class="btn-press text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2.5 py-1.5 rounded-lg border border-indigo-200 transition text-right">
              🪖 מועד מיוחד למילואים
            </button>
            <button onclick="askQuick('שכחתי סיסמה למודל, למי פונים?')" class="btn-press text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2.5 py-1.5 rounded-lg border border-indigo-200 transition text-right">
              🔑 שכחתי סיסמה למודל
            </button>
          </div>
        </div>
      `;
      chatMessages.appendChild(div);
    }

    function showChatError(text) {
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2.5 msg-in';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-bold shrink-0">⚠️</div>
        <div class="bg-rose-50 border border-rose-200 rounded-2xl rounded-tr-none p-3.5 text-sm text-rose-700 shadow-sm max-w-[85%] break-words">${escapeHtml(text)}</div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function askQuick(text) {
      const input = document.getElementById('questionInput');
      if (isSending) return;
      input.value = text;
      sendMessage(new Event('submit'));
    }

    function appendUserBubble(text) {
      const div = document.createElement('div');
      div.className = 'flex items-start justify-end gap-2.5 msg-in';
      div.innerHTML = `
        <div class="bg-indigo-600 text-white rounded-2xl rounded-tl-none p-3.5 text-sm shadow-sm max-w-[80%] whitespace-pre-wrap break-words">${escapeHtml(text)}</div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendStaticBotBubble(text) {
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2.5 msg-in';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold shrink-0">🤖</div>
        <div class="bg-white border border-slate-200 rounded-2xl rounded-tr-none p-3.5 text-sm text-slate-800 shadow-sm max-w-[85%] whitespace-pre-wrap break-words">${escapeHtml(text)}</div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function createBotBubble() {
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2.5 msg-in';
      const contentDiv = document.createElement('div');
      contentDiv.className = 'bg-white border border-slate-200 rounded-2xl rounded-tr-none p-3.5 text-sm text-slate-800 shadow-sm max-w-[85%] whitespace-pre-wrap break-words typing-cursor';
      div.innerHTML = `<div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold shrink-0">🤖</div>`;
      div.appendChild(contentDiv);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return contentDiv;
    }

    function setInputLoading(loading) {
      const sendBtn = document.getElementById('sendBtn');
      isSending = loading;
      // בכוונה לא מנטרלים (disabled) את שדה ההקלדה: שדה מנוטרל מאבד פוקוס מיד,
      // וזה מה שגרם למקלדת ב-iOS להיסגר ולהיפתח מחדש בכל הודעה - חסימת שליחה כפולה
      // כבר קיימת למעלה דרך הדגל isSending, אז זה לא פוגע בהגנה מפני לחיצה כפולה.
      sendBtn.disabled = loading;
      sendBtn.innerHTML = loading ? `<span class="spinner"></span>` : 'שלח';
    }

    async function sendMessage(e) {
      e.preventDefault();
      if (isSending) return;
      const input = document.getElementById('questionInput');
      const question = input.value.trim();
      if (!question) return;

      input.value = '';
      appendUserBubble(question);
      setInputLoading(true);

      try {
        if (!currentConversationId) {
          const ok = await createConversation();
          if (!ok) {
            const botBubble = createBotBubble();
            botBubble.textContent = '⚠️ לא ניתן ליצור שיחה חדשה כרגע. נסו שוב בעוד רגע.';
            botBubble.classList.remove('typing-cursor');
            botBubble.classList.add('text-rose-600', 'border-rose-200', 'bg-rose-50');
            return;
          }
        }

        const botBubble = createBotBubble();

        const { res, networkError } = await apiFetch('/api/chat/stream/v2', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversation_id: currentConversationId,
            question: question,
            moodle_token: MOODLE_TOKEN || null,
            moodle_user_id: MOODLE_USER_ID ? parseInt(MOODLE_USER_ID, 10) : null
          })
        });

        if (networkError) {
          botBubble.textContent = '⚠️ שגיאת תקשורת מול השרת. ודאו שהשרת פעיל ונסו שוב.';
          botBubble.classList.remove('typing-cursor');
          botBubble.classList.add('text-rose-600', 'border-rose-200', 'bg-rose-50');
          return;
        }

        if (!res.ok) {
          const err = await safeJson(res);
          botBubble.textContent = `⛔ ${err.detail || 'שגיאה בשליחת השאלה'}`;
          botBubble.classList.remove('typing-cursor');
          botBubble.classList.add('text-rose-600', 'border-rose-200', 'bg-rose-50');
          return;
        }

        if (!res.body || !res.body.getReader) {
          const text = await res.text();
          botBubble.textContent = text;
          botBubble.classList.remove('typing-cursor');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullText = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          fullText += chunk;
          botBubble.textContent = fullText;
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        if (!fullText.trim()) {
          botBubble.textContent = 'לא התקבלה תשובה מהשרת. נסו לשאול שוב.';
        }
        botBubble.classList.remove('typing-cursor');

        const conv = conversationsCache.find(c => c.id === currentConversationId);
        if (conv && (!conv.title || conv.title === 'שיחה חדשה')) {
          conv.title = question.length > 28 ? question.slice(0, 28) + '…' : question;
          renderConversationsList();
          updateConversationIndicator();
        }
      } catch (err) {
        const existing = chatMessages.lastElementChild;
        if (existing) {
          const bubble = existing.querySelector('div:last-child');
          if (bubble) {
            bubble.textContent = '⚠️ שגיאה לא צפויה. נסו שוב.';
            bubble.classList.remove('typing-cursor');
          }
        }
      } finally {
        setInputLoading(false);
      }
    }

    // ---------- Service worker ----------
    let swRegistration = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => { swRegistration = reg; })
        .catch(() => {});
    }

    // ---------- Push notifications אמיתיות (OS-level) ----------
    // כשversion.json ב-GitHub משתנה, השרת שולח Push אמיתי דרך ה-service worker -
    // זה מגיע גם כשהאפליקציה סגורה לגמרי (לא רק כש-הטאב פתוח, בניגוד ל-update-check.js).
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    async function subscribeToPushNotifications() {
      try {
        if (!TOKEN) return;
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        if (!swRegistration) {
          swRegistration = await navigator.serviceWorker.ready;
        }
        if (Notification.permission === 'denied') return;

        let existing = await swRegistration.pushManager.getSubscription();
        if (!existing) {
          if (Notification.permission === 'default') {
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') return;
          } else if (Notification.permission !== 'granted') {
            return;
          }

          const { res: keyRes, networkError: keyErr } = await apiFetch('/api/push/vapid-public-key');
          if (keyErr || !keyRes.ok) return;
          const { publicKey } = await safeJson(keyRes);
          if (!publicKey) return;

          existing = await swRegistration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey)
          });
        }

        const sub = existing.toJSON();
        await apiFetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: sub.endpoint, keys: sub.keys })
        });
      } catch (err) {
        /* הרשמה ל-push היא תוספת נחמדה-ליש, אסור שתכשיל את האפליקציה אם היא נכשלת */
      }
    }

    // ---------- Boot ----------
    (async function boot() {
      if (TOKEN) {
        authScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');
        await initConversations();
        subscribeToPushNotifications();
      } else {
        chatScreen.classList.add('hidden');
        authScreen.classList.remove('hidden');
      }
      initLoader.classList.add('hidden');
    })();
  </script>

  <script>
  /* התאמת הגובה למקלדת - רק עבור דפדפנים שלא תומכים ב-interactive-widget=resizes-content.
     ברוב המכשירים המודרניים (iOS 17.4+, Chrome עדכני) הדפדפן כבר מכווץ בעצמו את ה-layout
     viewport כשהמקלדת עולה, ו-100dvh כבר מגיב נכון לבד. הבאגים/הרעידות הקודמים נגרמו כי
     הסקריפט הזה היה "נלחם" בדפדפן ומעדכן את אותו הגובה פעמיים בו-זמנית. עכשיו, בכל אירוע,
     קודם בודקים אם הדפדפן כבר טיפל בזה לבד (window.innerHeight כבר תואם ל-visualViewport.height) -
     ואם כן, לא נוגעים בכלל ומשאירים ל-100dvh לעבוד. */
  (function () {
    const vv = window.visualViewport;
    const root = document.getElementById('appRoot');
    if (!vv || !root) return;
    const mq = window.matchMedia('(max-width: 639px)');
    let lastH = vv.height;
    let lastAppliedH = null;
    let lastAppliedTop = null;
    let ticking = false;

    function clearManualOverride() {
      if (lastAppliedH !== null || lastAppliedTop !== null) {
        root.style.removeProperty('--app-h');
        root.style.removeProperty('top');
        lastAppliedH = null;
        lastAppliedTop = null;
      }
    }

    function fit() {
      ticking = false;
      if (!mq.matches) { clearManualOverride(); return; }

      const h = vv.height;
      const top = vv.offsetTop;
      const nativeHandled = Math.abs(window.innerHeight - h) < 2;

      if (nativeHandled) {
        // הדפדפן כבר כיווץ את ה-viewport בעצמו - לא נוגעים, כדי לא ליצור "קרב" בין שני מנגנונים
        clearManualOverride();
      } else {
        if (h !== lastAppliedH) { root.style.setProperty('--app-h', h + 'px'); lastAppliedH = h; }
        if (top !== lastAppliedTop) { root.style.top = top + 'px'; lastAppliedTop = top; }
        if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
      }

      if (h < lastH) chatMessages.scrollTop = chatMessages.scrollHeight;
      lastH = h;
    }

    function onViewportChange() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(fit);
    }

    vv.addEventListener('resize', onViewportChange);
    vv.addEventListener('scroll', onViewportChange);
    mq.addEventListener('change', fit);
    fit();
  })();
</script>

<script src="/update-check.js"></script>
</body>
